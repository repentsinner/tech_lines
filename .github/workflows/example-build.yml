name: Example build

# Builds the example app for Linux, macOS and Windows and uploads each
# build as a workflow artifact. Given a release tag, it also attaches the
# builds to that release. Quality calls it without a tag on every pull
# request; Release calls it with the tag Flywheel pushed.

on:
  workflow_call:
    inputs:
      release-tag:
        description: Release to attach the builds to; empty to skip.
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutter 3.50's Linux embedder deadlocks on a Wayland window
          # resize, so the Linux build stays on 3.47 (see example/README.md).
          - os: ubuntu-latest
            platform: linux
            flutter: 3.47.9
            suffix: linux-x64.tar.gz
          - os: macos-latest
            platform: macos
            flutter: 3.50.0
            suffix: macos.zip
          - os: windows-latest
            platform: windows
            flutter: 3.50.0
            suffix: windows-x64.zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: example
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release names its builds by version, without the tag's leading v;
      # a pull request build has no version, so it takes the short commit.
      - name: Name the build
        working-directory: ${{ github.workspace }}
        env:
          TAG: ${{ inputs.release-tag }}
          SUFFIX: ${{ matrix.suffix }}
          # On a pull request, github.sha is the merge commit; name the head.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="${TAG#v}"
          version="${version:-${COMMIT::7}}"
          echo "ASSET=tech_lines_example-$version-$SUFFIX" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      # thermion_dart's build hook compiles its native library with clang;
      # the Flutter Linux embedder needs GTK, CMake and Ninja.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libc++-dev libc++abi-dev libgl-dev libegl-dev \
            libgles-dev libdrm-dev libgbm-dev zlib1g-dev \
            libudev-dev

      - name: Resolve
        run: flutter pub get

      # Runs the Dart build hooks before the platform build configures
      # CMake. thermion_flutter's CMake reads the Filament headers that
      # thermion_dart's hook extracts, and the two have no guaranteed order
      # (nmfisher/thermion#132), so a clean runner can configure before the
      # headers exist. `flutter test` builds the host's native assets first.
      - name: Test (builds native assets)
        run: flutter test

      # --no-pub: dependencies resolved above, so the build skips a second
      # resolution that can race with its own reads of the lockfile.
      - name: Build
        run: flutter build ${{ matrix.platform }} --release --no-pub

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: tar -C build/linux/x64/release/bundle -czf "$GITHUB_WORKSPACE/$ASSET" .

      # -y keeps the framework symlinks inside the .app as symlinks.
      # Without it, zip stores each framework binary three times and breaks
      # the bundle layout Gatekeeper inspects. The app is unsigned.
      - name: Package macOS
        if: matrix.platform == 'macos'
        working-directory: example/build/macos/Build/Products/Release
        run: zip -r -y -q "$GITHUB_WORKSPACE/$ASSET" tech_lines_example.app

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "build\windows\x64\runner\Release\*"
          -DestinationPath "$env:GITHUB_WORKSPACE\$env:ASSET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Attach to release
        if: inputs.release-tag != ''
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: gh release upload "$TAG" --clobber "$ASSET" --repo "$GITHUB_REPOSITORY"
